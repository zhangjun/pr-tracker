name: Scheduler probe

# TEMPORARY. Re-registration test: this file was active for 20 minutes and its
# */5 cron never fired once, while workflow_dispatch works instantly. Rewriting
# the file forces GitHub to parse the schedule again.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "fired $(date -u +%FT%TZ) via ${{ github.event_name }}"
